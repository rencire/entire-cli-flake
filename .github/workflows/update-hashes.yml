name: Update Nix hashes

on:
  pull_request:
    types: [opened, synchronize]
    paths: [nix/package.nix]
  workflow_dispatch: {}

jobs:
  update-hashes:
    # Only run on Renovate PRs (or manual dispatch for testing)
    if:
      startsWith(github.head_ref, 'renovate/') || github.event_name ==
      'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update Go toolchain pin
        run: nix run .#update-go-toolchain

      - name: Recompute srcHash and vendorHash
        run: nix run nixpkgs#nix-update -- --flake default --version skip

      - name: Verify package builds
        run: nix build .#

      - name: Commit updated hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nix/package.nix
          git diff --staged --quiet || (git commit -m "chore: update hashes" && git push)
