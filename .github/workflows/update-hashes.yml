name: Update Nix hashes

on:
  pull_request:
    types: [opened, synchronize]
    paths: [package.nix]
  workflow_dispatch: {}

jobs:
  update-hashes:
    # Only run on Renovate PRs (or manual dispatch for testing)
    if: startsWith(github.head_ref, 'renovate/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Recompute srcHash
        run: nix run nixpkgs#nix-update -- --flake entire --version skip

      # Workaround: nix-update sets vendorHash to the same value as srcHash
      # instead of computing it correctly. Root cause: postPatch (which downgrades
      # the go.mod toolchain directive) runs inside the goModules fixed-output
      # derivation, causing nix-update to misread the hash mismatch output.
      # Fix: trigger a real build failure and parse the correct hash from the error.
      # To remove: delete postPatch from package.nix and this entire step once
      # nixpkgs-unstable ships Go >= the version required by upstream's go.mod.
      - name: Recompute vendorHash (postPatch workaround)
        run: |
          VENDOR_HASH=$(nix build .#entire 2>&1 | grep -oP 'got:\s+\K\S+' || true)
          if [ -n "$VENDOR_HASH" ]; then
            sed -i "s|vendorHash = \"[^\"]*\"|vendorHash = \"${VENDOR_HASH}\"|" package.nix
          fi

      - name: Commit updated hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.nix
          git diff --staged --quiet || (git commit -m "chore: update hashes" && git push)
